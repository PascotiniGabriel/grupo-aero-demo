<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icone-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10231C" />
    <title>Aerobrasil — Gestão</title>
    <style>html[data-tema="escuro"]{background:#0E1714;color-scheme:dark}</style>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('aero-tema');
          var e = p === 'escuro' || (p !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (e) {
            document.documentElement.setAttribute('data-tema', 'escuro');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1714');
          }
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
